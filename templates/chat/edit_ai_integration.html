{% extends 'chat/base.html' %}

{% block title %}Редактирование интеграции — NextRoom{% endblock %}

{% block content %}
<div class="mx-auto max-w-2xl px-4 py-8 sm:px-6 lg:px-8 w-full flex-grow flex flex-col gap-6">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <a href="{% url 'ai_management' %}" class="inline-flex items-center gap-2 text-sm text-slate-400 hover:text-white transition duration-200 group mb-3">
                <svg class="w-4 h-4 transform group-hover:-translate-x-1 transition duration-250" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                Назад
            </a>
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">Редактирование @{{ integration.provider }}</h1>
        </div>
    </div>

    <div class="glass-panel rounded-3xl p-6">
        <form action="{% url 'edit_ai_integration' integration.pk %}" method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-slate-300">Провайдер</label>
                <input type="text" value="@{{ integration.provider }}" disabled class="mt-2 block w-full rounded-2xl bg-slate-800 border border-slate-700 px-4 py-3 text-sm text-slate-400">
            </div>
            <div>
                <label for="api_key" class="block text-sm font-medium text-slate-300">API ключ</label>
                <input id="api_key" name="api_key" type="text" value="{{ integration.api_key }}" class="mt-2 block w-full rounded-2xl bg-slate-900 border border-slate-800 px-4 py-3 text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" required>
            </div>
            <div>
                <label for="model_name" class="block text-sm font-medium text-slate-300">Модель</label>
                <input id="model_name" name="model_name" type="text" value="{{ integration.model_name|default:'' }}" class="mt-2 block w-full rounded-2xl bg-slate-900 border border-slate-800 px-4 py-3 text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label for="custom_prompt" class="block text-sm font-medium text-slate-300">Персональный промпт для этой модели</label>
                <textarea id="custom_prompt" name="custom_prompt" rows="3" placeholder="Например: Ты эксперт по программированию. Отвечай подробно и с примерами." class="mt-2 block w-full rounded-2xl bg-slate-900 border border-slate-800 px-4 py-3 text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 placeholder-slate-600 resize-none">{{ integration.custom_prompt|default:'' }}</textarea>
                <p class="text-xs text-slate-500 mt-1">Персональные правила и поведение исключительно для модели @{{ integration.provider }}.</p>
            </div>
            <div class="flex items-center gap-3">
                <button type="submit" class="relative inline-flex items-center justify-center gap-2 px-6 py-3 text-sm font-semibold text-slate-300 hover:text-white transition duration-300 group">
                    <span class="absolute inset-0 w-full h-full rounded-xl transition duration-300 ease-out transform translate-x-1 translate-y-1 bg-indigo-900/50 group-hover:-translate-x-0 group-hover:-translate-y-0"></span>
                    <span class="absolute inset-0 w-full h-full rounded-xl bg-slate-800/80 border border-slate-700/50 group-hover:bg-indigo-900/40 transition duration-300"></span>
                    <span class="relative z-10">Сохранить</span>
                </button>
                <a href="{% url 'delete_ai_integration' integration.pk %}" onclick="return confirm('Удалить интеграцию?')" class="relative inline-flex items-center justify-center gap-2 px-6 py-3 text-sm font-semibold text-slate-300 hover:text-white transition duration-300 group">
                    <span class="absolute inset-0 w-full h-full rounded-xl transition duration-300 ease-out transform translate-x-1 translate-y-1 bg-red-900/50 group-hover:-translate-x-0 group-hover:-translate-y-0"></span>
                    <span class="absolute inset-0 w-full h-full rounded-xl bg-slate-800/80 border border-slate-700/50 group-hover:bg-red-900/40 transition duration-300"></span>
                    <span class="relative z-10">Удалить</span>
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
