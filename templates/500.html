{% extends "chat/base.html" %}

{% block title %}Ошибка сервера - NextRoom{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh] p-4">
    <div class="bg-gray-900 border border-gray-800 rounded-3xl p-8 text-center shadow-lg" style="max-width: 500px; width: 100%;">
        <h1 class="text-6xl font-bold text-red-500 mb-4">500</h1>
        <h2 class="text-2xl font-semibold text-white mb-4">Внутренняя ошибка сервера</h2>
        <p class="text-gray-300 mb-8">Что-то пошло не так. Пожалуйста, попробуйте обновить страницу позже.</p>
        <a href="{% url 'dashboard' %}" class="inline-flex justify-center items-center px-6 py-3 border border-transparent rounded-full shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 transition-colors duration-200">
            Вернуться на главную
        </a>
    </div>
</div>
{% endblock %}
