{% extends "chat/base.html" %}

{% block title %}Ошибка сервера - NextRoom{% endblock %}

{% block content %}
<div class="flex-grow flex flex-col items-center justify-center p-4 sm:p-8 w-full">
    <div class="bg-slate-900/80 border border-slate-700/50 rounded-3xl p-8 sm:p-12 text-center shadow-2xl glass-panel w-full max-w-lg mx-auto">
        <h1 class="text-7xl sm:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-rose-600 mb-4 sm:mb-6">500</h1>
        <h2 class="text-2xl sm:text-3xl font-bold text-white mb-3 sm:mb-4">Ошибка сервера</h2>
        <p class="text-slate-300 text-sm sm:text-base mb-8 sm:mb-10 leading-relaxed">Что-то пошло не так. Пожалуйста, попробуйте обновить страницу позже.</p>
        <a href="{% url 'dashboard' %}" class="relative inline-flex justify-center items-center px-8 py-3.5 sm:px-10 sm:py-4 rounded-xl text-sm sm:text-base font-bold text-white transition duration-300 group overflow-hidden">
            <span class="absolute inset-0 w-full h-full bg-gradient-to-r from-blue-600 to-indigo-600 group-hover:scale-105 transition duration-300"></span>
            <span class="absolute inset-0 w-full h-full bg-indigo-500 opacity-0 group-hover:opacity-20 transition duration-300"></span>
            <span class="relative z-10 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                Вернуться на главную
            </span>
        </a>
    </div>
</div>
{% endblock %}
