{% extends "admin/base.html" %}
{% load i18n static %}

{% block userlinks %}
    {% if user.is_active and user.is_staff %}
        <span class="user-greeting text-slate-300">Добро пожаловать, <strong class="text-white">{{ user.username }}</strong>.</span>
        {% if user.has_usable_password %}
        <a href="{% url 'admin:password_change' %}" class="text-indigo-400 hover:text-indigo-300 transition ml-2">Сменить пароль</a> /
        {% endif %}
        <a href="{% url 'landing' %}" target="_blank" class="text-indigo-400 hover:text-indigo-300 transition">Просмотр сайта</a> /
        <form id="logout-form" action="{% url 'admin:logout' %}" method="post" style="display: inline;">
            {% csrf_token %}
            <button type="submit" class="text-slate-400 hover:text-red-400 transition ml-1" style="background: none; border: none; font: inherit; cursor: pointer; text-decoration: underline; padding: 0;">Выйти</button>
        </form>
    {% endif %}
{% endblock %}
